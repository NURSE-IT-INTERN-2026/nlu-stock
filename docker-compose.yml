services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nlu_stock
      POSTGRES_USER: nlu_stock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
